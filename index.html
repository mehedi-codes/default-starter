<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Title</title>

    <!-- Metadata -->
    <meta name="title" content="Page Title" />
    <meta name="description" content="Page description" />
    <meta name="keywords" content="html, html5, portfolio" />
    <meta name="author" content="Your Name" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="Page Title" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://example.com" />
    <meta property="og:image" content="https://example.com/img/og-image.jpg" />
    <meta property="og:site_name" content="Website Name" />
    <meta property="og:description" content="Page description" />

    <!-- Twitter -->
    <meta property="twitter:title" content="Page Title" />
    <meta property="twitter:description" content="Page description" />
    <meta property="twitter:image" content="https://example.com/img/twitter-image.jpg" />
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:site" content="@yourusername" />
    <meta property="twitter:url" content="https://example.com" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/favicon/favicon.png" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="mask-icon" href="/favicon/safari-pinned-tab.svg" color="#5bbad5" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="384x384" href="/favicon/android-chrome-384x384.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon/android-chrome-512x512.png" />
    <meta name="msapplication-config" content="/favicon/browserconfig.xml" />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="styles.css" />

    <!-- Scripts -->
    <script src="script.js"></script>
  </head>
  <body>
    <!-- Your HTML body content goes here -->

    <script>
      // JavaScript code can be added here
    </script>
  </body>
</html>
